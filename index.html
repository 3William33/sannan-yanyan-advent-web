<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>砚砚 × 三三 · 双人降临历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&family=Noto+Serif+SC:wght@400&display=swap">
<link rel="stylesheet" href="advent.css?v=8.2.1">
<link rel="stylesheet" href="music.css?v=8.2.1">
<link rel="stylesheet" href="vendor/abcjs-audio.css?v=8.2.1">
<style>
  /* 顶栏 */
  .adv-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 28px;
    margin-bottom: 2px;
  }
  .adv-wrap > .adv-topbar { position: relative; z-index: 10; }
  .adv-topbar .adv-stars { color: var(--adv-gold); font-size: 13px; }

  /* 底部操作区 */
  .adv-links { flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 4px; }

  /* 存档/帮助浮层复用 adv-zoom + adv-sheet */
  .adv-sheet { width: min(380px, 100%); }

  /* 编辑器 Spotify/网易云 URL 输入组 */
  .adv-url-row { display: flex; gap: 6px; }
  .adv-url-row .adv-in1 { flex: 1; }
  .adv-url-row button {
    font-family: var(--adv-fell); font-style: italic; font-size: 13px;
    background: none; border: 1px solid rgba(107,68,35,.4); color: var(--adv-sepia);
    border-radius: 999px; padding: 0 12px; cursor: pointer; white-space: nowrap;
  }

  /* 录音按钮 */
  .adv-rec-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #c0392b; animation: pulse-rec .8s ease-in-out infinite;
    margin-right: 5px; vertical-align: middle;
  }
  @keyframes pulse-rec { 50% { opacity: .3; } }

  /* 图片预览 */
  .adv-img-preview {
    width: 64px; height: 64px; object-fit: cover;
    border-radius: 2px; display: block;
  }

  /* 状态信息 */
  .adv-sync-line {
    text-align: center;
    font-family: var(--adv-fell);
    font-style: italic;
    font-size: 12px;
    color: var(--adv-muted);
    margin-top: 6px;
    min-height: 1.4em;
  }
</style>
</head>
<body>

<!-- 主页面 -->
<div class="adv-page" id="page">
  <div class="adv-wrap">

    <!-- 顶栏 -->
    <div class="adv-topbar">
      <span class="adv-left">
        <b id="topDay">12</b> déc.
      </span>
      <span class="adv-stars" id="topStars">★ 0 · 偷看 0</span>
    </div>
    <div class="adv-topbar" style="min-height:0;margin-bottom:0">
      <span style="display:flex;gap:6px">
        <button class="adv-pill" id="displayBtn" style="font-size:11px;padding:4px 10px;min-height:36px" title="切换显示模式：自动 / 白昼 / 夜间">☾ 自动</button>
        <button class="adv-pill" id="smoothBtn" style="font-size:11px;padding:4px 10px;min-height:36px" title="流畅模式：减少动画与特效，保留全部美术">⚡ 流畅 · 关</button>
      </span>
      <button class="adv-pill" id="whoBtn" style="font-size:11px;padding:4px 10px;min-height:36px">偷看记名：三三</button>
      <button class="adv-pill" id="writerBtn" type="button" style="font-size:11px;padding:4px 10px;min-height:36px" title="切换写礼物身份；不会改变偷看记名">写礼物：三三</button>
    </div>

    <!-- 标题 -->
    <div class="adv-head">
      <div class="adv-eyebrow">Advent for Us · 2026</div>
      <h1 id="headTitle">砚砚 × 三三</h1>
    </div>

    <!-- 房子舞台（house.js 挂载点） -->
    <div class="adv-stage" id="stage"></div>

    <!-- 圣诞书桌：倒计时、礼物堆、共享书桌与常用操作 -->
    <section class="adv-desk" id="desk" aria-label="圣诞书桌">
      <div class="adv-desk-top">
        <span class="adv-desk-label">Christmas desk</span>
        <span class="adv-desk-date" id="deskDate">12 月 · 北京时间</span>
      </div>
      <div class="adv-desk-calendar">
        <span class="adv-desk-calendar-day" id="deskDay">—</span>
        <span><b>圣诞日历</b><small id="deskCountdown">等候十二月的雪</small></span>
      </div>

      <section class="adv-gift-stats" aria-label="双方礼物统计">
        <div class="adv-desk-section-head"><span>Our little gifts</span><small id="giftStatsStatus">正在核对礼物堆…</small></div>
        <div class="adv-gift-piles">
          <button class="adv-gift-pile adv-gift-pile-yan" id="yanGiftPile" type="button" aria-label="查看砚砚的礼物">
            <span class="adv-pile-scene" aria-hidden="true"><span class="adv-pile-star">✦</span><span class="adv-pile-sprig">❧</span><span class="adv-pile-boxes"></span><span class="adv-pile-ground"></span></span>
            <span class="adv-pile-caption"><span>砚砚的礼物堆</span><b id="yanGiftCount">—</b></span>
          </button>
          <button class="adv-gift-pile adv-gift-pile-san" id="sanGiftPile" type="button" aria-label="查看三三的礼物">
            <span class="adv-pile-scene" aria-hidden="true"><span class="adv-pile-star">✧</span><span class="adv-pile-sprig">❧</span><span class="adv-pile-boxes"></span><span class="adv-pile-ground"></span></span>
            <span class="adv-pile-caption"><span>三三的礼物堆</span><b id="sanGiftCount">—</b></span>
          </button>
        </div>
        <div class="adv-gift-summary" id="giftSummary" aria-live="polite"></div>
      </section>

      <section class="adv-desk-tools" aria-label="常用功能">
        <button class="adv-desk-object adv-collection-object" id="deskCollection" type="button"><span class="adv-object-mark">▤</span><b>礼物收藏馆</b><small>按日期与类型翻阅</small></button>
        <button class="adv-desk-object adv-mail adv-desk-mail" id="deskMail" type="button"><span class="adv-object-mark">✉</span><b>圣诞邮局</b><small id="deskMailStatus">等待新信件</small><small class="adv-desk-mail-latest" id="deskMailLatest">暂无投递活动</small></button>
        <button class="adv-desk-object adv-frame-object" id="deskPhoto" type="button"><span class="adv-object-photo">♡</span><b>桌面相框</b><small>翻看我们的照片</small></button>
        <button class="adv-desk-object adv-note-object" id="deskNote" type="button"><span class="adv-object-mark">✎</span><b>今日便签</b><small>留一句冬日的话</small></button>
        <button class="adv-desk-object adv-record" id="deskRecord" type="button"><span class="adv-object-mark">♫</span><b>圣诞唱片机</b><small id="deskRecordStatus">点击播放背景音乐</small></button>
      </section>

      <section class="adv-desk-display" aria-label="共同书桌">
        <div class="adv-desk-section-head"><span>On our desk</span><small>只展示已经公开的照片与便签</small></div>
        <div class="adv-desk-surface">
          <svg class="adv-desk-botanical" viewBox="0 0 180 90" aria-hidden="true"><path d="M8 78C52 67 87 49 161 18M42 62C30 48 29 35 39 24M70 51C62 35 66 20 80 9M101 38C107 24 122 17 139 16"/><path d="M39 24C27 23 20 29 19 40C31 41 38 35 39 24ZM80 9C73 1 64 1 56 7C63 17 72 18 80 9ZM139 16C145 6 155 3 166 7C161 18 151 21 139 16Z"/></svg>
          <div class="adv-desk-frame-slot" id="deskFrameSlot"><div class="adv-empty-frame">♡</div><small>等一张公开的桌面照片</small></div>
          <div class="adv-desk-note-slot" id="deskNoteSlot"><div class="adv-empty-note"> aujourd’hui <span>把小小的日常留在桌上</span></div></div>
          <button class="adv-desk-record-slot" id="deskRecordCard" type="button" aria-label="打开圣诞唱片机"><span class="adv-mini-disc">♫</span><span><small>now on the turntable</small><b id="deskTrackName">冬日留声机</b></span></button>
          <span class="adv-desk-pencil" aria-hidden="true">✎</span>
        </div>
      </section>

      <div class="adv-desk-bottom">
        <button class="adv-desk-pen" id="deskWrite" type="button"><b>✎ 藏一份礼物</b><span>写信、照片、音乐与手账</span></button>
        <button class="adv-desk-drawer" id="deskDiary" type="button"><b>▱ 手账抽屉</b><span>贴纸 · 信纸 · 草稿</span></button>
      </div>
      <nav class="adv-desk-actions" aria-label="书桌操作">
        <button class="adv-pill" onclick="UI.openScrapbook()">手账贴纸</button>
        <button class="adv-pill" onclick="UI.syncNow()">↻ 同步</button>
        <button class="adv-pill" onclick="UI.showArchive()">存档</button>
        <button class="adv-pill" onclick="UI.showPublish()">⬆ 发布</button>
        <button class="adv-pill" onclick="UI.showHelp()">说明</button>
      </nav>
      <div class="adv-puff" aria-hidden="true">🐶</div>
      <audio id="deskAudio" preload="metadata"></audio>
    </section>

    <!-- 偷看提示 -->
    <div class="adv-peeks" id="peekLine"></div>

    <!-- 同步状态 -->
    <div class="adv-sync-line" id="syncLine">正在同步…</div>


  </div>
</div>

<!-- 礼物卡 / 编辑器浮层（由 app.js 动态填充） -->
<div id="overlay" class="adv-zoom" style="display:none" role="dialog" aria-modal="true"></div>

<!-- Toast -->
<div class="adv-toast" id="toast" aria-live="polite"></div>

<!-- 脚本：顺序很重要 -->
<script src="house.js?v=8.2.1" type="module"></script>
<script src="music.js?v=8.2.1"></script>
<script src="app.js?v=8.2.1" type="module"></script>
</body>
</html>
